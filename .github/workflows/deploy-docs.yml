name: Deploy Documentation

on:
  push:
    branches: [main, master]
    paths:
      - 'book/**'
      - 'docs/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'README.md'
      - 'src/**'
      - 'tests/documentation_contract.rs'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'book/**'
      - 'docs/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'README.md'
      - 'src/**'
      - 'tests/documentation_contract.rs'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Build book
        run: mdbook build book

      - name: Setup documentation check runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test rendered documentation checker
        run: python3 -B -m unittest discover -s scripts/tests -v

      - name: Check rendered local-execution policy
        run: python3 -B scripts/check_book_playground.py book/book --local-only

      - name: Run documented standalone quickstart
        run: python3 -B scripts/check_book_quickstart.py

      - name: Check executable documentation before deployment
        run: |
          cargo test --locked --test documentation_contract
          cargo test --locked --doc --all-features

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --root-dir book/book book/book

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book/book
