name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-Dwarnings"
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_UNSTABLE_SPARSE_REGISTRY: true
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CACHE_ON_FAILURE: true

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: rustfmt, clippy

    - name: Install nextest
      uses: taiki-e/install-action@nextest

    - name: Install Claude CLI
      run: |
        # Create a mock claude command that just exits successfully
        # This satisfies the CLI check without needing actual Claude CLI
        mkdir -p $HOME/.local/bin
        echo '#!/bin/bash' > $HOME/.local/bin/claude
        echo 'echo "claude version 0.1.0 (mock for testing)"' >> $HOME/.local/bin/claude
        chmod +x $HOME/.local/bin/claude
        echo "$HOME/.local/bin" >> $GITHUB_PATH
      shell: bash

    - name: Run tests
      run: cargo nextest run --all-features

    - name: Run documentation contract
      run: cargo test --doc --all-features

    - name: Run default-feature tests and documentation
      run: cargo test

    - name: Test canonical registration example
      run: cargo test --example user_registration --all-features
    
    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
    
    - name: Check formatting
      run: cargo fmt --all -- --check
    
    - name: Check documentation
      run: cargo doc --no-deps --document-private-items

  check:
    name: Cargo Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: Install mdBook
      uses: taiki-e/install-action@mdbook

    - name: Install documentation check runtime
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Test rendered documentation checker
      run: python3 -B -m unittest discover -s scripts/tests -v

    - name: Check all targets
      run: cargo check --all-targets --all-features

    - name: Build documentation book
      run: mdbook build book

    - name: Check rendered local-execution policy
      run: python3 -B scripts/check_book_playground.py book/book --local-only

    - name: Run documented standalone quickstart
      run: python3 -B scripts/check_book_quickstart.py

  try-trait:
    name: Try Trait Nightly
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install nightly Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: nightly

    - name: Run try_trait tests
      run: RUSTFLAGS="-Dwarnings --cfg try_trait_nightly" cargo +nightly test --features try_trait --test try_trait

  examples:
    name: Build Examples
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: Build all examples
      run: cargo build --examples --all-features
